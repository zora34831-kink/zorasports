
name: ZORASPORTS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PFOOTBALL_API_KEY="$FOOTBALL_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORASPORTS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
