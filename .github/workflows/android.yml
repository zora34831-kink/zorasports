
name: ZORASPORTS APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ZORASPORTS and ZORAADMIN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare Android Debug Keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.config/.android"
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cp "$HOME/.config/.android/debug.keystore" \
             "$HOME/.android/debug.keystore"

      - name: Check Android Manifest
        shell: bash
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f admin/src/main/AndroidManifest.xml

      - name: Generate SHA Fingerprints
        shell: bash
        run: |
          echo "========== APP SIGNING REPORT =========="
          gradle :app:signingReport --no-daemon

          echo "========== ADMIN SIGNING REPORT =========="
          gradle :admin:signingReport --no-daemon

      - name: Build Both APKs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          gradle :app:assembleDebug :admin:assembleDebug \
            --no-daemon \
            --stacktrace \
            -PFOOTBALL_API_KEY="$FOOTBALL_API_KEY"

      - name: Verify APK Files
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f admin/build/outputs/apk/debug/admin-debug.apk

          echo "ZORASPORTS APK: OK"
          echo "ZORAADMIN APK: OK"

      - name: Upload APK Files
        uses: actions/upload-artifact@v4
        with:
          name: ZORA-ANDROID-APKS
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 14
