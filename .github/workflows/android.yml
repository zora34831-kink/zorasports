
name: ZORASPORTS APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ZORASPORTS and ZORAADMIN
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # 4. Create shared debug keystore
      - name: Prepare Android Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/.android"
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storetype PKCS12 \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cp "$HOME/.config/.android/debug.keystore" \
             "$HOME/.android/debug.keystore"

          echo "========== SHARED KEYSTORE =========="

          keytool -list -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storetype PKCS12 \
            -storepass android \
            -alias AndroidDebugKey

          echo "KEYSTORE: OK"

      # 5. Check manifests
      - name: Check Android Manifest
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/AndroidManifest.xml
          test -f admin/src/main/AndroidManifest.xml

          echo "APP MANIFEST: OK"
          echo "ADMIN MANIFEST: OK"

      # 6. Generate fingerprints
      - name: Generate SHA Fingerprints
        shell: bash
        run: |
          set -euo pipefail

          echo "========== ZORASPORTS =========="
          gradle :app:signingReport --no-daemon

          echo "========== ZORAADMIN =========="
          gradle :admin:signingReport --no-daemon

      # 7. Build both APKs
      - name: Build Both APKs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug :admin:assembleDebug \
            --no-daemon \
            --stacktrace \
            -PFOOTBALL_API_KEY="$FOOTBALL_API_KEY"

      # 8. Verify APK files
      - name: Verify APK Files
        shell: bash
        run: |
          set -euo pipefail

          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s admin/build/outputs/apk/debug/admin-debug.apk

          echo "ZORASPORTS APK: OK"
          echo "ZORAADMIN APK: OK"

      # 9. Verify signatures and compare certificates
      - name: Verify APK Signatures
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(find "$SDK_DIR/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          APP_APK="app/build/outputs/apk/debug/app-debug.apk"
          ADMIN_APK="admin/build/outputs/apk/debug/admin-debug.apk"

          "$APKSIGNER" verify --verbose --print-certs "$APP_APK"
          "$APKSIGNER" verify --verbose --print-certs "$ADMIN_APK"

          APP_CERT="$( "$APKSIGNER" verify --print-certs "$APP_APK" \
            | grep 'Signer #1 certificate SHA-256 digest:' \
            | head -n 1 | awk '{print $NF}')"

          ADMIN_CERT="$( "$APKSIGNER" verify --print-certs "$ADMIN_APK" \
            | grep 'Signer #1 certificate SHA-256 digest:' \
            | head -n 1 | awk '{print $NF}')"

          echo "APP SHA-256: $APP_CERT"
          echo "ADMIN SHA-256: $ADMIN_CERT"

          if [ "$APP_CERT" != "$ADMIN_CERT" ]; then
            echo "ERROR: APK certificates are different!"
            exit 1
          fi

          echo "SUCCESS: BOTH APK CERTIFICATES MATCH"

      # 10. Upload APKs
      - name: Upload APK Files
        uses: actions/upload-artifact@v4
        with:
          name: ZORA-ANDROID-APKS
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 14
