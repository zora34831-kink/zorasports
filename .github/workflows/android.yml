
name: ZORASPORTS + ZORAADMIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Generate Debug Keystore for ZORASPORTS
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -v \
            -storetype JKS \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare Permanent Admin Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 belum diatur"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zora-upload.jks"

          test -s "$RUNNER_TEMP/zora-upload.jks"

      - name: Verify Signing Credentials
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/zora-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Checking keystore password..."

          keytool -list \
            -keystore "$ANDROID_KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "Keystore password OK"

          echo "Checking private key password..."

          keytool -certreq \
            -keystore "$ANDROID_KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/test.csr"

          echo "SIGNING_CREDENTIALS_OK"

      - name: Build Both APKs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/zora-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleDebug :admin:assembleDebug \
            --no-daemon \
            --stacktrace \
            -PFOOTBALL_API_KEY="$FOOTBALL_API_KEY"

      - name: Prepare APK Files
        run: |
          mkdir -p release

          cp app/build/outputs/apk/debug/app-debug.apk \
            release/ZORASPORTS.apk

          cp admin/build/outputs/apk/debug/admin-debug.apk \
            release/ZORAADMIN.apk

          ls -lh release/

      - name: Upload Both APKs
        uses: actions/upload-artifact@v4
        with:
          name: ZORA-ANDROID-APKS
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
