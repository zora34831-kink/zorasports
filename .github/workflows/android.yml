
name: ZORASPORTS + ZORAADMIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Two APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Generate Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -v \
            -storetype JKS \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Both APKs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          gradle :app:assembleDebug :admin:assembleDebug \
            --no-daemon \
            --stacktrace \
            -PFOOTBALL_API_KEY="$FOOTBALL_API_KEY"

      - name: Prepare APK Files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ZORASPORTS.apk
          cp admin/build/outputs/apk/debug/admin-debug.apk release/ZORAADMIN.apk
          ls -lh release/

      - name: Upload Both APKs
        uses: actions/upload-artifact@v4
        with:
          name: ZORA-ANDROID-APKS
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
