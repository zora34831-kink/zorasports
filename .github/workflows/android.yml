
name: ZORASPORTS APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ZORASPORTS and ZORAADMIN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # RESTORE PERMANENT KEYSTORE
      - name: Restore Permanent Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          if [ "$ANDROID_KEY_ALIAS" != "androiddebugkey" ]; then
            echo "ERROR: Alias must be androiddebugkey"
            exit 1
          fi

          if [ "$ANDROID_KEYSTORE_PASSWORD" != "android" ] || \
             [ "$ANDROID_KEY_PASSWORD" != "android" ]; then
            echo "ERROR: Debug keystore passwords are incorrect"
            exit 1
          fi

          mkdir -p "$HOME/.config/.android"
          mkdir -p "$HOME/.android"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$HOME/.config/.android/debug.keystore"

          cp "$HOME/.config/.android/debug.keystore" \
             "$HOME/.android/debug.keystore"

          keytool -list -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS"

          echo "PERMANENT KEYSTORE RESTORED"

      - name: Check Android Manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/AndroidManifest.xml
          test -f admin/src/main/AndroidManifest.xml
          echo "MANIFEST CHECK OK"

      - name: Generate SHA Fingerprints
        shell: bash
        run: |
          set -euo pipefail

          echo "========== ZORASPORTS =========="
          gradle :app:signingReport --no-daemon

          echo "========== ZORAADMIN =========="
          gradle :admin:signingReport --no-daemon

      - name: Build Both APKs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug :admin:assembleDebug \
            --no-daemon \
            --stacktrace \
            -PFOOTBALL_API_KEY="$FOOTBALL_API_KEY"

      - name: Verify APK Files
        shell: bash
        run: |
          set -euo pipefail

          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s admin/build/outputs/apk/debug/admin-debug.apk

          echo "BOTH APK FILES EXIST"

      - name: Verify APK Signatures
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          APKSIGNER="$(find "$SDK_DIR/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          APP_APK="app/build/outputs/apk/debug/app-debug.apk"
          ADMIN_APK="admin/build/outputs/apk/debug/admin-debug.apk"

          APP_INFO="$("$APKSIGNER" verify --verbose --print-certs "$APP_APK")"
          ADMIN_INFO="$("$APKSIGNER" verify --verbose --print-certs "$ADMIN_APK")"

          echo "$APP_INFO"
          echo "$ADMIN_INFO"

          APP_SHA1="$(printf '%s\n' "$APP_INFO" \
            | sed -n 's/.*certificate SHA-1 digest: //p' \
            | head -n 1 | tr -d '[:space:]')"

          ADMIN_SHA1="$(printf '%s\n' "$ADMIN_INFO" \
            | sed -n 's/.*certificate SHA-1 digest: //p' \
            | head -n 1 | tr -d '[:space:]')"

          APP_SHA256="$(printf '%s\n' "$APP_INFO" \
            | sed -n 's/.*certificate SHA-256 digest: //p' \
            | head -n 1 | tr -d '[:space:]')"

          ADMIN_SHA256="$(printf '%s\n' "$ADMIN_INFO" \
            | sed -n 's/.*certificate SHA-256 digest: //p' \
            | head -n 1 | tr -d '[:space:]')"

          echo "APP SHA-1: $APP_SHA1"
          echo "ADMIN SHA-1: $ADMIN_SHA1"
          echo "APP SHA-256: $APP_SHA256"
          echo "ADMIN SHA-256: $ADMIN_SHA256"

          if [ -z "$APP_SHA1" ] || [ -z "$ADMIN_SHA1" ] || \
             [ -z "$APP_SHA256" ] || [ -z "$ADMIN_SHA256" ]; then
            echo "ERROR: Fingerprint missing"
            exit 1
          fi

          if [ "$APP_SHA1" != "$ADMIN_SHA1" ] || \
             [ "$APP_SHA256" != "$ADMIN_SHA256" ]; then
            echo "ERROR: APK certificates do not match"
            exit 1
          fi

          echo "SUCCESS: PERMANENT APK SIGNATURES MATCH"

      - name: Upload APK Files
        uses: actions/upload-artifact@v4
        with:
          name: ZORA-ANDROID-APKS
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 14
