
name: ZORASPORTS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ZORASPORTS and ZORAADMIN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Restore keystore permanen dari GitHub Secret
      - name: Restore Permanent Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret DEBUG_KEYSTORE_BASE64 kosong."
            exit 1
          fi

          mkdir -p "$HOME/.android"

          printf '%s' "$DEBUG_KEYSTORE_BASE64" \
            | tr -d ' \n\r\t' \
            | base64 --decode \
            > "$HOME/.android/debug.keystore"

          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "ERROR: Keystore kosong."
            exit 1
          fi

          echo "Memverifikasi keystore..."

          keytool -list -v \
            -storetype PKCS12 \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

          echo "PERMANENT KEYSTORE: OK"

      - name: Check Android Manifest
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/AndroidManifest.xml
          test -f admin/src/main/AndroidManifest.xml

          echo "APP MANIFEST: OK"
          echo "ADMIN MANIFEST: OK"

      # Tampilkan fingerprint kedua aplikasi
      - name: Generate SHA Fingerprints
        shell: bash
        run: |
          set -euo pipefail

          echo "========== ZORASPORTS =========="
          gradle :app:signingReport --no-daemon

          echo "========== ZORAADMIN =========="
          gradle :admin:signingReport --no-daemon

      # Build kedua APK
      - name: Build Both APKs
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug :admin:assembleDebug \
            --no-daemon \
            --stacktrace \
            -PFOOTBALL_API_KEY="$FOOTBALL_API_KEY"

      # Pastikan kedua APK tersedia
      - name: Verify APK Files
        shell: bash
        run: |
          set -euo pipefail

          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s admin/build/outputs/apk/debug/admin-debug.apk

          echo "ZORASPORTS APK: OK"
          echo "ZORAADMIN APK: OK"

      # Verifikasi tanda tangan APK
      - name: Verify APK Signatures
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_DIR" ]; then
            echo "ERROR: Android SDK tidak ditemukan."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_DIR/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner tidak ditemukan."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

          "$APKSIGNER" verify --verbose --print-certs \
            admin/build/outputs/apk/debug/admin-debug.apk

          echo "APK SIGNATURES: OK"

      # Upload hasil build
      - name: Upload APK Files
        uses: actions/upload-artifact@v4
        with:
          name: ZORA-ANDROID-APKS
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 14
